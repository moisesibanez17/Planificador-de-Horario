<header class="l-header glass" id="mainHeader">
    <div class="header-brand">
        <div class="logo-wrapper">
            <img src="{{ url_for('static', path='assets/icon.png') }}" alt="Logo" class="header-logo">
            <div class="logo-glow"></div>
        </div>
        <div>
            <h1 class="header-title">Planificador<span>UDG</span></h1>
            <p class="header-tagline">By students, for students</p>
        </div>
    </div>

    <nav class="header-nav" id="headerNav">
        <a href="/planner" class="nav-link"><i class="fas fa-calendar-alt"></i><span>Horarios</span></a>
        <a href="/professors" class="nav-link"><i class="fas fa-chalkboard-teacher"></i><span>Profesores</span></a>
        <a href="https://beneficios.diferente.page/" target="_blank" class="nav-link"><i class="fas fa-gift"></i><span>Beneficios</span></a>
    </nav>

    <div class="header-auth">
        {% if session_user %}
        <div class="auth-group">
            <a href="/dashboard" class="l-btn l-btn-primary">Dashboard</a>
            <a href="/logout" class="l-btn l-btn-text" title="Cerrar sesión"><i class="fas fa-sign-out-alt"></i></a>
        </div>
        {% else %}
        <div class="auth-group">
            <a href="/login" class="l-btn l-btn-text">Entrar</a>
            <a href="/signup" class="l-btn l-btn-primary">Crear cuenta</a>
        </div>
        {% endif %}
    </div>

    <button class="mobile-menu-toggle" id="mobileMenuToggle" aria-label="Menú">
        <i class="fas fa-bars"></i>
    </button>
</header>

<script>
(function() {
    const toggle = document.getElementById('mobileMenuToggle');
    const nav = document.getElementById('headerNav');
    const header = document.getElementById('mainHeader');
    if (toggle && nav) {
        toggle.addEventListener('click', function() {
            header.classList.toggle('nav-open');
            const icon = toggle.querySelector('i');
            if (header.classList.contains('nav-open')) {
                icon.classList.replace('fa-bars', 'fa-times');
            } else {
                icon.classList.replace('fa-times', 'fa-bars');
            }
        });
        // Cerrar al hacer clic en un link
        nav.querySelectorAll('.nav-link').forEach(function(link) {
            link.addEventListener('click', function() {
                header.classList.remove('nav-open');
                const icon = toggle.querySelector('i');
                icon.classList.replace('fa-times', 'fa-bars');
            });
        });
    }
})();
</script>
